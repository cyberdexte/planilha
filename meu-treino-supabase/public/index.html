<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Meu Treino</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:ital,wght@0,600;1,700;1,800&display=swap" rel="stylesheet">
<style>
/* ===== Tokens ===== */
@property --p{syntax:'<number>';inherits:false;initial-value:0}
:root{--bg:#09090b;--bg2:#101013;--card:#15151a;--card2:#1c1c22;--bd:#27272f;--tx:#f3f3f5;--mu:#9b9ba7;--ac:#e11d2e;--ok:#34c47c;
--fd:"Barlow Condensed","Arial Narrow",Impact,sans-serif;--fb:Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);font:16px/1.5 var(--fb);background:radial-gradient(900px 480px at 88% -8%,color-mix(in srgb,var(--ac) 16%,transparent),transparent 62%),var(--bg);padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));min-height:100vh}
main{max-width:760px;margin:0 auto;padding:18px 16px}
h1,h2,.dt{font-family:var(--fd);font-style:italic;font-weight:800;letter-spacing:.01em;line-height:1.05;margin:0}
h1{font-size:clamp(1.9rem,5vw,2.6rem)}
h2{font-size:1.45rem;margin:1.6rem 0 .8rem}
.mu{color:var(--mu);font-size:.92rem}p{margin:.3rem 0}
.hd{padding-right:56px;margin-bottom:18px}.hd p{margin-top:6px}
svg.i{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}svg.i.f{fill:currentColor;stroke:none}
/* ===== Buttons ===== */
button{font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--bd);border-radius:10px;padding:10px 16px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,border-color .15s,transform .15s,filter .15s}
button:hover{border-color:#3d3d48;background:#24242c}button:active{transform:scale(.98)}
button.p,.btn.p{background:var(--ac);border-color:transparent;color:#fff;font-weight:600}
button.p:hover,.btn.p:hover{background:var(--ac);filter:brightness(1.12)}
button.done{background:var(--ok);border-color:transparent;color:#04210f;font-weight:600}button.done:hover{background:var(--ok);filter:brightness(1.08)}
button:disabled{opacity:.45;cursor:not-allowed}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:10px;font-weight:600;text-decoration:none;color:var(--tx);background:var(--card2);border:1px solid var(--bd);transition:filter .15s,transform .15s}.btn:active{transform:scale(.98)}
.btn.p{color:#fff}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
a{color:var(--ac)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:12px}
.msg{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 10%,var(--card))}
.tag{font-size:.74rem;background:var(--card2);border:1px solid var(--bd);padding:2px 10px;border-radius:99px;color:var(--mu);white-space:nowrap}
input{font:inherit;width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--bg2);color:var(--tx);margin-bottom:10px;transition:border-color .15s}input:focus{border-color:var(--ac);outline:0}
.sb{position:relative}.sb svg{position:absolute;left:14px;top:14px;color:var(--mu);pointer-events:none}.sb input{padding-left:42px}
/* ===== Navigation (rodapé no celular, barra lateral no desktop) ===== */
nav{position:fixed;z-index:6;left:0;right:0;bottom:0;display:flex;background:color-mix(in srgb,var(--bg2) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav .lg,nav .out{display:none}
nav button[data-v]{flex:1;flex-direction:column;gap:2px;border:0;border-radius:0;background:none;color:var(--mu);font-size:.72rem;padding:9px 2px;min-height:58px}
nav button[data-v] svg.i{width:22px;height:22px}
nav button[data-v].on{color:var(--ac);font-weight:600}
.avb{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:14px;width:44px;height:44px;min-height:0;padding:0;border-radius:50%;overflow:hidden;z-index:5;background:var(--ac);border:2px solid var(--bd);color:#fff;font-weight:700}.avb img{width:100%;height:100%;object-fit:cover}
/* ===== Marca ===== */
.logo{display:flex;align-items:center;gap:10px}.logo b{font-family:var(--fd);font-style:italic;font-weight:800;font-size:1.35rem;letter-spacing:.03em}
/* ===== Barras e anel de progresso ===== */
.bar{height:8px;background:var(--card2);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ac);border-radius:9px;transform-origin:left;transition:width .4s}
.an .bar i{animation:grow .7s ease-out}
.ring{--p:0;width:118px;height:118px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--ac) calc(var(--p)*1%),var(--card2) 0)}
.an .ring{animation:ringin .9s ease-out}
.ring span{width:92px;height:92px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-family:var(--fd);font-style:italic;font-weight:800;font-size:1.9rem}
@keyframes ringin{from{--p:0}}@keyframes grow{from{transform:scaleX(0)}}@keyframes fade{from{opacity:0}}@keyframes up{from{opacity:0;transform:translateY(14px)}}
/* ===== Início ===== */
.g2{display:grid;gap:12px}
.hero{position:relative;overflow:hidden;border:1px solid var(--bd);border-radius:16px;min-height:230px;display:flex;align-items:flex-end;background:radial-gradient(420px 260px at 85% 20%,color-mix(in srgb,var(--ac) 38%,transparent),transparent 70%),repeating-linear-gradient(135deg,transparent 0 14px,#ffffff07 14px 15px),linear-gradient(120deg,#1b0b0f,#0c0c10 65%)}
.bgm{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ov{position:absolute;inset:0;background:linear-gradient(90deg,#09090bf2 8%,#09090b99 55%,#09090b40)}
.hc{position:relative;padding:22px;width:100%}
.hc .big{font-family:var(--fd);font-style:italic;font-weight:800;font-size:clamp(2rem,6vw,3rem);line-height:1;margin:6px 0 10px}
.hc .lbl{color:#ffb3ba;font-weight:600;font-size:.9rem}
.hc .bar{max-width:380px;background:#ffffff20}
.rg{display:flex;gap:18px;align-items:center;margin:0}
.rl{flex:1;min-width:0}.rr{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--bd);font-size:.92rem}.rr:last-child{border:0}.rr span{color:var(--mu)}
.okt{color:var(--ok);font-weight:600;margin-top:8px;display:flex;gap:6px;align-items:center}
.wk{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dy{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;padding:12px;min-height:104px;justify-content:space-between;background:var(--card);border-radius:12px}
.dy b{font-family:var(--fd);font-style:italic;font-weight:800;font-size:1.25rem;line-height:1}.dy small{color:var(--mu);font-size:.76rem;line-height:1.25}
.dy .bar{width:100%;height:5px;margin:6px 0 0}
.dy.td{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 10%,var(--card))}
.dy.fn{border-color:color-mix(in srgb,var(--ok) 55%,var(--bd))}.dy.fn .bar i{background:var(--ok)}
.dy .st{display:flex;align-items:center;gap:5px;font-size:.76rem;color:var(--ok);font-weight:600;min-height:1.2em}
/* ===== Treinos / exercícios ===== */
.scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px;scrollbar-width:thin}
.chip{padding:8px 16px;min-height:40px;border-radius:999px;white-space:nowrap}.chip.on{background:var(--ac);border-color:transparent;color:#fff;font-weight:600}
.chip.fin{background:color-mix(in srgb,var(--ok) 20%,var(--card2));border-color:var(--ok);color:var(--ok);font-weight:600}.chip.fin.on{background:var(--ok);color:#04210f}
.xl{display:grid;gap:12px}
.xc{background:var(--card);border:1px solid var(--bd);border-left:3px solid var(--bd);border-radius:14px;padding:16px;transition:transform .2s,border-color .2s,background .2s}
.xc.ok{border-left-color:var(--ok);background:linear-gradient(90deg,color-mix(in srgb,var(--ok) 9%,var(--card)),var(--card))}
.xt{display:flex;gap:12px;align-items:flex-start}.xb{flex:1;min-width:0}.xb b{display:block;font-size:1.05rem;line-height:1.25}
.xi{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--ac) 16%,var(--card2));color:var(--ac);flex:none}
.xc.ok .xi{background:var(--ok);color:#04210f}.xc.ok .xb b{color:#cfeedd}
.xm{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 0 12px;color:var(--mu);font-size:.88rem}
.xc .row button.w{flex:1 1 100%}
.fin-box{display:flex;gap:12px;align-items:center}
.fin-ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--card));color:var(--ok)}
/* ===== Modal "Como fazer" ===== */
#md{position:fixed;inset:0;background:#000c;backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center;z-index:20}
#md.on{display:flex;animation:fade .2s}
#md>div{background:var(--bg2);border:1px solid var(--bd);width:100%;max-width:1020px;max-height:94%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px));animation:up .25s ease}
.mh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}.mh .dt{font-size:clamp(1.7rem,4vw,2.3rem);margin:6px 0 2px}
.ib{padding:0;width:44px;flex:none;border-radius:50%}
.mg{display:grid;gap:16px}.mg h2{font-size:1.25rem;margin:0 0 8px}
.vb{position:relative;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;margin-bottom:10px;border:1px solid var(--bd)}
.vb iframe,.vth,.vth img{position:absolute;inset:0;width:100%;height:100%;border:0}
.vth{padding:0;border:0;border-radius:0;background:#000}.vth img{object-fit:cover;opacity:.85;transition:opacity .2s}.vth:hover img{opacity:1}
.pl{position:relative;width:64px;height:64px;border-radius:50%;background:var(--ac);display:grid;place-items:center;color:#fff;box-shadow:0 6px 24px #0008;transition:transform .2s}.pl svg{width:26px;height:26px;margin-left:3px}.vth:hover .pl{transform:scale(1.08)}
.vno{display:grid;place-items:center;text-align:center;padding:16px;background:repeating-linear-gradient(135deg,transparent 0 14px,#ffffff06 14px 15px),var(--card)}.vno div{display:flex;flex-direction:column;gap:4px;align-items:center}.vno svg{width:34px;height:34px;color:var(--ac)}
.stt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.stt div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;text-align:center}
.stt b{display:block;font-family:var(--fd);font-style:italic;font-weight:800;font-size:1.5rem;line-height:1.1}.stt span{color:var(--mu);font-size:.8rem}
.sec{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}
.steps{list-style:none;padding:0;margin:0;counter-reset:s}.steps li{counter-increment:s;display:flex;gap:12px;padding:7px 0}
.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:color-mix(in srgb,var(--ac) 22%,var(--card2));color:#fff;display:grid;place-items:center;font-size:.8rem;font-weight:600}
ul{padding-left:20px;margin:.3rem 0}
/* ===== Descanso ===== */
#tm{font-family:var(--fd);font-style:italic;font-weight:800;font-size:clamp(4rem,18vw,6.5rem);line-height:1;text-align:center;margin:10px 0}
/* ===== Perfil ===== */
.g3{display:grid;gap:12px}.g3 .card{margin:0}
.pc{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.bigav{width:96px;height:96px;border-radius:50%;overflow:hidden;background:var(--ac);display:grid;place-items:center;font-family:var(--fd);font-style:italic;font-weight:800;font-size:2.6rem;border:3px solid var(--bd);margin-bottom:6px}.bigav img{width:100%;height:100%;object-fit:cover}
.sw{width:44px;height:44px;border-radius:50%;padding:0;border:2px solid transparent}.sw.on{border-color:#fff}
/* ===== Login ===== */
body.noav{padding-bottom:0}body.noav main{max-width:none;padding:0;margin:0}
.au{min-height:100vh;display:grid}
.ah{position:relative;overflow:hidden;display:flex;align-items:flex-end;min-height:230px;background:radial-gradient(500px 340px at 80% 30%,color-mix(in srgb,var(--ac) 40%,transparent),transparent 70%),repeating-linear-gradient(135deg,transparent 0 14px,#ffffff07 14px 15px),linear-gradient(120deg,#1b0b0f,#0a0a0d 70%)}
.ahc{position:relative;padding:28px 22px;max-width:560px}.ahc .big{font-family:var(--fd);font-style:italic;font-weight:800;font-size:clamp(2.3rem,8vw,4.4rem);line-height:.98;margin:0 0 14px}.ahc .big em{color:var(--ac)}
.ahc p{color:#d6d6dc}.bl{margin-top:20px;border-left:3px solid var(--ac);padding-left:12px;font-weight:600}
.af{display:grid;place-items:center;padding:22px 16px 40px}
.ac{width:100%;max-width:420px;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:26px 22px}
.ac .logo{justify-content:center;margin-bottom:18px}.ac .logo b{font-size:1.7rem}
.tabs{display:flex;margin-bottom:16px;border-bottom:1px solid var(--bd)}
.tabs button{flex:1;border:0;border-radius:0;background:none;color:var(--mu);border-bottom:2px solid transparent;margin-bottom:-1px}.tabs button.on{color:var(--tx);font-weight:600;border-bottom-color:var(--ac)}
/* ===== Notificação motivacional ===== */
#mt{position:fixed;z-index:15;top:calc(64px + env(safe-area-inset-top,0px));right:14px;width:min(330px,calc(100vw - 28px));display:flex;align-items:center;gap:12px;padding:12px 8px 12px 14px;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(10px);border:1px solid var(--bd);border-left:3px solid var(--ac);border-radius:12px;box-shadow:0 10px 30px #0009;opacity:0;visibility:hidden;transform:translateY(-10px);transition:opacity .3s,transform .3s,visibility 0s .3s}
#mt.on{opacity:1;visibility:visible;transform:none;transition:opacity .3s,transform .3s}
#mt .mi{color:var(--ac);display:grid;place-items:center}#mt .mi svg{width:24px;height:24px}
#mt p{flex:1;margin:0;font-size:.92rem;line-height:1.35;font-weight:500}
#mt button{width:36px;min-height:36px;height:36px;padding:0;border:0;background:none;color:var(--mu);border-radius:50%}#mt button:hover{background:var(--card2);color:var(--tx)}
/* ===== Administrador ===== */
nav button[hidden]{display:none!important}
textarea,select{font:inherit;width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--bg2);color:var(--tx);margin-bottom:10px}
textarea{min-height:76px;resize:vertical}textarea:focus,select:focus{border-color:var(--ac);outline:0}
.lb{display:block;color:var(--mu);font-size:.85rem;margin:8px 0 4px}
.adg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:12px 0}
.ad{flex-direction:column;align-items:flex-start;justify-content:flex-start;text-align:left;gap:2px;padding:12px;min-height:96px;background:var(--card);border-radius:12px;font-size:.85rem}
.ad b{font-family:var(--fd);font-style:italic;font-weight:800;font-size:1.05rem}
.ad .ex{display:block;color:var(--mu);font-size:.8rem;line-height:1.3}
.ad.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 10%,var(--card))}
.adx{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.adx .gr{color:var(--mu);cursor:grab;user-select:none}.adx .ab{display:flex;flex-wrap:wrap;gap:6px}
button.sm{min-height:36px;padding:6px 12px;font-size:.85rem}
button.danger{color:#ff8a93}button.danger:hover{border-color:#ff8a93}
.pkr{width:100%;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:2px;text-align:left;background:var(--card)}
.okbox{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--card));color:var(--ok)}
.errbox{border-color:#ff5c6a;background:color-mix(in srgb,#ff5c6a 10%,var(--card))}
/* ===== Tablet / Desktop ===== */
@media(min-width:640px){.wk{grid-template-columns:repeat(3,1fr)}.xl{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}.pc{grid-row:span 3}}
@media(min-width:900px){
 body{padding-bottom:0}
 nav{top:0;bottom:0;right:auto;width:236px;flex-direction:column;border-top:0;border-right:1px solid var(--bd);padding:24px 14px 20px;gap:4px;background:var(--bg2)}
 nav .lg{display:flex;padding:0 10px 22px}nav .out{display:flex;margin-top:auto;justify-content:flex-start;background:none;border-color:transparent;color:var(--mu)}
 nav button[data-v]{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:.95rem;padding:11px 14px;min-height:46px;border-radius:10px;color:var(--mu)}
 nav button[data-v]:hover{background:var(--card2);color:var(--tx)}
 nav button[data-v].on{background:color-mix(in srgb,var(--ac) 20%,transparent);color:#fff}nav button[data-v].on svg{color:var(--ac)}
 main{margin-left:236px;max-width:1180px;padding:30px 40px 60px}
 .g2{grid-template-columns:1.7fr 1fr}.hero{min-height:260px}.wk{grid-template-columns:repeat(6,1fr)}
 #md{align-items:center;padding:24px}#md>div{border-radius:20px;max-height:92vh;padding:24px 28px}
 .mg{grid-template-columns:1.15fr 1fr;align-items:start}
 .au{grid-template-columns:1.15fr 1fr}.ah{min-height:100vh}.ahc{padding:56px}.af{padding:40px}
 #mt{top:20px;right:78px}
 .g3{grid-template-columns:300px 1fr}
 @media(hover:hover){.xc:hover{transform:translateY(-2px);border-color:#3a3a44}.dy:hover{transform:translateY(-2px)}}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}}

 if(!/^\S+@\S+\.\S+$/.test(em)){ADM.err="Digite um e-mail válido.";draw();return}
 ADM.busy=true;draw();
 try{const r=await sb.rpc("admin_find_student",{p_email:em});if(r.error)throw r.error;ADM.st=(r.data&&r.data[0])||null;if(!ADM.st)ADM.err="Nenhum aluno encontrado com este e-mail."}
 catch(e){console.error(e);ADM.err="Não foi possível buscar o aluno. Tente novamente."}
 ADM.busy=false;draw()}
async function admLoadLog(){try{const r=await sb.from("admin_audit_log").select("admin_email,action,details,created_at").eq("student_id",ADM.st.user_id).order("created_at",{ascending:false}).limit(5);ADM.log=r.error?[]:(r.data||[])}catch(e){ADM.log=[]}}
async function admEdit(){ADM.busy=true;ADM.err="";ADM.ok="";draw();const uid=ADM.st.user_id;
 try{const[a,b]=await Promise.all([sb.from("student_plans").select("user_id").eq("user_id",uid).maybeSingle(),sb.from("student_plan_days").select("weekday,title,notes,student_plan_exercises(exercise_id,position)").eq("user_id",uid)]);
  if(a.error||b.error)throw a.error||b.error;ADM.custom=!!a.data;ADM.draft=ADM.custom?rowsToDraft(b.data):defDraft();ADM.orig=clone(ADM.draft);ADM.d=Math.max(ADM.draft.findIndex(d=>d.ids.length),0);await admLoadLog()}
 catch(e){console.error(e);ADM.err="Não foi possível carregar o treino do aluno. Tente novamente."}
 ADM.busy=false;draw()}
// ---- edição (só no rascunho; nada é salvo até clicar em "Salvar alterações") ----
function admDay(i){ADM.d=i;chg();draw()}
function admAdd(){ADM.pk={mode:"add",i:-1};ADM.pq="";admPickOpen()}
function admRep(i){ADM.pk={mode:"rep",i};ADM.pq="";admPickOpen()}
function admPickOpen(){const P=ADM.pk;dlg(`<div class="mh"><div><h1 class="dt" style="font-size:1.7rem">${P.mode=="rep"?"Substituir exercício":"Adicionar exercício"}</h1><div class="mu">${ADN[ADM.d]}</div></div><button class="ib" onclick="closeM()" aria-label="Fechar">${ic("x")}</button></div><div class="sb">${ic("search")}<input id="pk-q" type="search" autocomplete="off" placeholder="Buscar exercício..." aria-label="Buscar exercício" oninput="ADM.pq=this.value;admPkList()"></div><div id="pk-l" style="display:grid;gap:8px;max-height:52vh;overflow:auto"></div>`);admPkList()}
function admPkList(){const t=normalizeSearch(ADM.pq).split(" ").filter(Boolean),cur=ADM.draft[ADM.d].ids,L=K.filter(k=>t.every(w=>SIX[k].includes(w)));
 $("#pk-l").innerHTML=L.length?L.map(k=>{const x=g(k),dis=cur.includes(k);return`<button class="pkr" ${dis?"disabled":""} onclick="admPick('${k}')"><b>${x.name}</b><span class="mu">${x.cat}. ${x.eq}${dis?" (já está neste treino)":""}</span></button>`}).join(""):'<p class="mu">Nenhum exercício encontrado.</p>'}
function admPick(id){const D=ADM.draft[ADM.d],P=ADM.pk;if(!E[id]||D.ids.includes(id))return;chg();
 if(P.mode=="rep")D.ids[P.i]=id;else{D.ids.push(id);if(!D.title.trim())D.title="Treino de "+low(ADM.d)}closeM();draw()}
function admRm(i){ADM.pk={i};dlg(`<h1 class="dt" style="font-size:1.6rem">Remover exercício</h1><p style="margin-top:10px">Tem certeza que deseja remover este exercício do treino de ${low(ADM.d)}?</p><p class="mu"><b>${E[ADM.draft[ADM.d].ids[i]][0]}</b> sai apenas do treino deste aluno.</p>${dlgBtns("Remover exercício","admRmOk()","p")}`)}
function admRmOk(){chg();ADM.draft[ADM.d].ids.splice(ADM.pk.i,1);closeM();draw()}
function admUp(i,dir){const a=ADM.draft[ADM.d].ids,j=i+dir;if(j<0||j>=a.length)return;chg();[a[i],a[j]]=[a[j],a[i]];draw()}
function admDrop(j){const g0=ADM.dg;ADM.dg=null;if(!g0||g0[0]!=ADM.d||g0[1]==j)return;chg();const a=ADM.draft[ADM.d].ids,[x]=a.splice(g0[1],1);a.splice(j,0,x);draw()}
const dayOpts=ex=>ADN.map((n,i)=>i==ex?"":`<option value="${i}">${n}</option>`).join("");
function admMv(i){ADM.pk={i};dlg(`<h1 class="dt" style="font-size:1.6rem">Mover exercício</h1><p class="mu" style="margin-top:8px"><b>${E[ADM.draft[ADM.d].ids[i]][0]}</b> sai de ${low(ADM.d)}.</p><label class="lb" for="mv-t">Mover para:</label><select id="mv-t">${dayOpts(ADM.d)}</select><p id="mv-e" class="mu" style="color:#ff8a93"></p>${dlgBtns("Mover exercício","admMvOk()","p")}`)}
function admMvOk(){const t=+$("#mv-t").value,D=ADM.draft[ADM.d],id=D.ids[ADM.pk.i],T=ADM.draft[t];
 if(T.ids.includes(id)){$("#mv-e").textContent="Este exercício já está no treino de "+low(t)+".";return}
 chg();D.ids.splice(ADM.pk.i,1);T.ids.push(id);if(!T.title.trim())T.title="Treino de "+low(t);closeM();ADM.d=t;draw()}
function admSw(){dlg(`<h1 class="dt" style="font-size:1.6rem">Mudar dia da semana</h1><p class="mu" style="margin-top:8px">O treino de ${low(ADM.d)} será levado para o dia escolhido. Se o dia já tiver treino, os dois trocam de lugar.</p><label class="lb" for="mv-t">Novo dia:</label><select id="mv-t">${dayOpts(ADM.d)}</select>${dlgBtns("Mudar dia","admSwOk()","p")}`)}
function admSwOk(){const t=+$("#mv-t").value,a=ADM.draft;chg();[a[ADM.d],a[t]]=[a[t],a[ADM.d]];closeM();ADM.d=t;draw()}
function admClr(){dlg(`<h1 class="dt" style="font-size:1.6rem">Remover dia de treino</h1><p style="margin-top:10px">Tem certeza que deseja remover o treino de ${low(ADM.d)}? O dia ficará como descanso.</p>${dlgBtns("Remover dia","admClrOk()","p")}`)}
function admClrOk(){chg();ADM.draft[ADM.d]={title:"",notes:"",ids:[]};closeM();draw()}
function admDiscard(){chg();ADM.draft=clone(ADM.orig);draw()}
// ---- salvar ----
function admSummary(){const c=admDiff();chg();
 if(!c.length){ADM.err="Nenhuma alteração para salvar.";draw();return}
 ADM.sum=c;dlg(`<h1 class="dt" style="font-size:1.6rem">Salvar alterações</h1><p style="margin-top:10px">Você está alterando o treino de <b>${esc(ADM.st.display_name)}</b>.</p><p class="mu" style="margin:8px 0 4px">Alterações:</p><ul>${c.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>${dlgBtns("Salvar alterações","admSave()","p")}`)}
async function admSave(){if(ADM.busy)return;ADM.busy=true;const dr=normDraft(ADM.draft),days=dr.map((d,i)=>({weekday:i,title:d.title,notes:d.notes,exercises:d.ids})).filter(d=>d.exercises.length);
 try{const r=await sb.rpc("admin_save_student_plan",{p_user:ADM.st.user_id,p_plan:days,p_summary:ADM.sum});if(r.error)throw r.error;
  ADM.draft=dr;ADM.orig=clone(dr);ADM.custom=true;ADM.ok="Treino atualizado com sucesso.";ADM.err="";if(ADM.st.user_id==UID)await loadPlan();await admLoadLog()}
 catch(e){console.error(e);ADM.err="Não foi possível salvar as alterações. Tente novamente.";ADM.ok=""}
 ADM.busy=false;closeM();draw()}
// ---- tela ----
function adminH(){const A=ADM,st=A.st;
 let h=`<header class="hd"><h1>Administrador</h1><p class="mu">Gerenciar treinos dos alunos</p></header><section class="card"><b>Buscar aluno</b><div class="sb" style="margin-top:8px">${ic("search")}<input id="adm-q" type="email" autocomplete="off" placeholder="Digite o e-mail do aluno" aria-label="E-mail do aluno" value="${esc(A.q)}" onkeydown="if(event.key=='Enter')admSearch()"></div><button class="p" onclick="admSearch()" ${A.busy?"disabled":""}>${A.busy&&!st?"Buscando...":"Buscar aluno"}</button></section>`;
 if(A.err&&!A.draft)h+=`<div class="card errbox">${A.err}</div>`;
 if(!st)return h;
 h+=`<section class="card"><b>Aluno encontrado</b><div class="rr" style="margin-top:8px"><span>Nome</span><b>${esc(st.display_name)}</b></div><div class="rr"><span>E-mail</span><b>${esc(st.email)}</b></div><div class="rr"><span>Status da conta</span><b>${esc(st.status)}</b></div>${A.draft?"":`<button class="p" style="margin-top:12px" onclick="admEdit()" ${A.busy?"disabled":""}>${A.busy?"Carregando...":"Editar treino"}</button>`}</section>`;
 if(!A.draft)return h;
 const d=A.d,D=A.draft[d];
 h+=`${A.ok?`<div class="card okbox">${A.ok}</div>`:""}${A.err?`<div class="card errbox">${A.err}</div>`:""}<h2>Treino de ${esc(st.display_name)}</h2>${A.custom?"":'<p class="mu">Este aluno ainda usa o treino padrão. Ao salvar, será criado um treino personalizado só para ele.</p>'}
 <div class="adg">${ADN.map((n,i)=>{const x=A.draft[i];return`<button class="ad ${i==d?"on":""}" onclick="admDay(${i})"><b>${n.toUpperCase()}</b><span class="mu">${x.ids.length?esc(x.title||"Treino"):"Descanso"}</span>${x.ids.map(id=>`<span class="ex">${E[id][0]}</span>`).join("")}</button>`}).join("")}</div>
 <section class="card"><b>${ADN[d]}</b>${D.ids.length?"":'<p class="mu" style="margin:8px 0">Dia de descanso. Adicione um exercício para criar um treino neste dia.</p>'}
 <label class="lb" for="adm-t">Nome do treino</label><input id="adm-t" maxlength="80" placeholder="Ex.: Treino de Pernas A" value="${esc(D.title)}" oninput="ADM.draft[${d}].title=this.value">
 <label class="lb" for="adm-n">Observações (opcional)</label><textarea id="adm-n" maxlength="500" placeholder="Ex.: Foco em quadríceps" oninput="ADM.draft[${d}].notes=this.value">${esc(D.notes)}</textarea>
 ${D.ids.map((id,i)=>{const x=g(id);return`<div class="adx" draggable="true" ondragstart="ADM.dg=[${d},${i}]" ondragover="event.preventDefault()" ondrop="admDrop(${i})"><span class="gr" aria-hidden="true">⋮⋮</span><div class="xb"><b>${i+1}. ${x.name}</b><div class="mu">${x.cat}. ${x.eq}</div></div><div class="ab"><button class="sm" onclick="admUp(${i},-1)" ${i==0?"disabled":""} aria-label="Subir exercício">↑</button><button class="sm" onclick="admUp(${i},1)" ${i==D.ids.length-1?"disabled":""} aria-label="Descer exercício">↓</button><button class="sm" onclick="admRep(${i})">Substituir</button><button class="sm" onclick="admMv(${i})">Mover</button><button class="sm danger" onclick="admRm(${i})">Remover</button></div></div>`}).join("")}
 <div class="row" style="margin-top:6px"><button onclick="admAdd()">${D.ids.length?"+ Adicionar exercício":"+ Adicionar dia de treino"}</button>${D.ids.length?'<button onclick="admSw()">Mudar dia da semana</button><button class="danger" onclick="admClr()">Remover dia de treino</button>':""}</div></section>
 <div class="row"><button class="p" onclick="admSummary()" ${A.busy?"disabled":""}>Salvar alterações</button><button onclick="admDiscard()">Descartar alterações</button></div>
 ${A.log.length?`<h2>Últimas alterações</h2><section class="card">${A.log.map(l=>`<div class="rr"><span>${fdate(l.created_at)}, ${esc(l.admin_email||"")}</span><b>${l.action=="plan_update"?"Treino atualizado":esc(l.action)} (${((l.details&&l.details.changes)||[]).length})</b></div>`).join("")}</section>`:""}`;
 return h}
function boot(){document.querySelector("nav").style.display="none";document.body.classList.add("noav");try{localStorage.removeItem("treino_cache")}catch(e){}// drop old shared cache
 if(!sb){app.innerHTML='<p class="card">Não foi possível carregar seus dados. Verifique a configuração do Supabase.</p>';return}
 app.innerHTML='<p class="mu" style="padding:20px">Carregando...</p>';
 sb.auth.onAuthStateChange((ev,ses)=>{setTimeout(()=>sess(ev,ses),0)})}
boot();
document.addEventListener("visibilitychange",()=>{if(document.hidden||!UID)return;const o=WK;calc();if(WK!=o){done={};fin={};last="";day=Math.max(TI,0);cache();init()}else draw()});
</script></body></html>
